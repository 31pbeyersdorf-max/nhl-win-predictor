
name: Update NHL Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt



      - name: Restore historical NHL winners and predictions
        run: |
          mkdir -p data predictions
          cp reference_data/nhl_tied_game_winners.csv data/nhl_tied_game_winners.csv
          cp dashboard_data/predictions.csv predictions/predictions.csv
          if [ -f dashboard_data/verified_live_results.csv ]; then
            cp dashboard_data/verified_live_results.csv predictions/verified_live_results.csv
          fi
                    if [ -f dashboard_data/market_odds.csv ]; then
            cp dashboard_data/market_odds.csv data/market_odds.csv
          fi



      - name: Download latest MoneyPuck data
        run: python src/update_data.py

      - name: Update official NHL winners
        run: python src/fetch_nhl_winners.py

      - name: Generate NHL predictions
        run: python src/predict_upcoming.py

      - name: Track completed NHL games
        run: python src/track_predictions.py
      
      - name: Fetch latest sportsbook odds
        id: fetch_odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_market_odds.py

      - name: Compare model predictions with sportsbook odds
        if: steps.fetch_odds.outcome == 'success'
        run: python src/compare_market.py


      - name: Update published dashboard data
        run: |
          cp data/nhl_tied_game_winners.csv reference_data/nhl_tied_game_winners.csv
          cp predictions/predictions.csv dashboard_data/predictions.csv
          if [ -f predictions/verified_live_results.csv ]; then
            cp predictions/verified_live_results.csv dashboard_data/verified_live_results.csv
          fi
          if [ -f predictions/verified_live_metrics.csv ]; then
            cp predictions/verified_live_metrics.csv dashboard_data/verified_live_metrics.csv
          fi
                    if [ -f data/market_odds.csv ]; then
            cp data/market_odds.csv dashboard_data/market_odds.csv
          fi
          if [ -f predictions/market_comparison.csv ]; then
            cp predictions/market_comparison.csv dashboard_data/market_comparison.csv
          fi
          date -u +"%Y-%m-%d %H:%M:%S" > dashboard_data/last_updated.txt


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/ reference_data/nhl_tied_game_winners.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL predictions"
            git push
          fi
